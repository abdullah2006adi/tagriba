<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>الطَّهَارَةُ مِنَ النَّجَاسَاتِ – درس تفاعلي (منصة استعداد)</title>
<script type="application/json" id="iste3dad-lesson">
{"id": "g3-altahara-min-alnajasat", "version": 1, "title": "الطَّهَارَةُ مِنَ النَّجَاسَاتِ", "sub": "وَثِيَابَكَ فَطَهِّرْ 🧼", "icon": "🧼", "components": [{"key": "s1", "label": "المحطة (1)", "max": 8}, {"key": "s2", "label": "المحطة (2)", "max": 8}, {"key": "s3", "label": "المحطة (3)", "max": 8}, {"key": "s4", "label": "المحطة (4)", "max": 8}, {"key": "s5", "label": "المحطة (5)", "max": 8}, {"key": "quiz", "label": "الاختبار", "max": 10}], "autoMax": 50, "written": {"max": 0}}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --a:#ff5fa2; --b:#7c4dff; --c:#ffc93c;
  --ink:#2b2350; --soft:#6b6390; --card:#ffffff;
  --ok:#22c55e; --okd:#15803d; --bad:#ff6b6b; --badd:#d64545;
  --sky1:#7ee8fa; --sky2:#c3b1ff;
  --r:26px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"Baloo Bhaijaan 2","Tajawal",system-ui,sans-serif;
  color:var(--ink); min-height:100vh; overflow-x:hidden;
  background:
    radial-gradient(circle at 12% 18%, rgba(255,255,255,.55) 0 60px, transparent 61px),
    radial-gradient(circle at 88% 12%, rgba(255,255,255,.45) 0 40px, transparent 41px),
    radial-gradient(circle at 80% 85%, rgba(255,255,255,.35) 0 80px, transparent 81px),
    linear-gradient(160deg, var(--sky1) 0%, var(--sky2) 55%, #ffd6e8 100%);
  background-attachment:fixed;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(rgba(255,255,255,.7) 2px, transparent 2.5px);background-size:46px 46px;opacity:.35}
button{font-family:inherit;cursor:pointer;color:inherit}
.wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:0 14px 120px}
.hide{display:none!important}

/* ===== الرأس ===== */
header.top{position:sticky;top:0;z-index:30;padding:10px 0 6px;
  background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,255,255,.75));backdrop-filter:blur(8px);
  box-shadow:0 6px 18px rgba(60,40,140,.15);border-bottom:4px solid rgba(255,255,255,.9)}
header .bar{max-width:980px;margin:0 auto;padding:0 12px;display:flex;align-items:center;gap:10px}
header h1{margin:0;font-size:24px;line-height:1.2;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:linear-gradient(90deg,var(--b),var(--a));-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:20px;padding:4px 14px;border-radius:999px;
  background:linear-gradient(180deg,#fff6c9,#ffd95a);box-shadow:0 4px 0 #e0a800,0 6px 12px rgba(0,0,0,.15);color:#7a4b00;white-space:nowrap}
.pill.bump{animation:bump .5s}
.ibtn{width:46px;height:46px;border:0;border-radius:16px;font-size:24px;display:grid;place-items:center;
  background:linear-gradient(180deg,#fff,#e9e4ff);box-shadow:0 5px 0 #b9adf0,0 7px 12px rgba(0,0,0,.15);transition:transform .1s}
.ibtn:active{transform:translateY(4px);box-shadow:0 1px 0 #b9adf0}

/* ===== أزرار ثلاثية الأبعاد ===== */
.btn3d{--c1:#8b5cf6;--c2:#6d28d9;--cs:#4c1d95;
  border:0;border-radius:22px;padding:12px 26px;font-size:24px;font-weight:800;color:#fff;
  background:linear-gradient(180deg,var(--c1),var(--c2));position:relative;
  box-shadow:0 8px 0 var(--cs),0 12px 22px rgba(0,0,0,.25);text-shadow:0 2px 0 rgba(0,0,0,.2);
  transition:transform .08s, box-shadow .08s}
.btn3d::after{content:"";position:absolute;inset:5px 10px auto 10px;height:40%;border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none}
.btn3d:active{transform:translateY(7px);box-shadow:0 1px 0 var(--cs),0 3px 8px rgba(0,0,0,.25)}
.btn3d.pink{--c1:#ff7eb6;--c2:#ff3d8b;--cs:#c2185b}
.btn3d.green{--c1:#4ade80;--c2:#16a34a;--cs:#166534}
.btn3d.orange{--c1:#ffb547;--c2:#ff8a00;--cs:#c25e00}
.btn3d.blue{--c1:#5ecbff;--c2:#1e88e5;--cs:#0d5aa7}
.btn3d.big{font-size:30px;padding:16px 36px;border-radius:28px}
.btn3d[disabled]{filter:grayscale(.7);opacity:.6;pointer-events:none}
.row{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}

/* ===== زر الصوت ===== */
.say{border:0;width:44px;height:44px;flex:0 0 44px;border-radius:50%;font-size:22px;display:inline-grid;place-items:center;vertical-align:middle;
  background:radial-gradient(circle at 35% 30%,#fff 0,#ffe46b 40%,#ffb400 100%);box-shadow:0 4px 0 #c98a00,0 6px 10px rgba(0,0,0,.2);margin-inline-start:8px}
.say:active{transform:translateY(3px);box-shadow:0 1px 0 #c98a00}
.say.on{animation:pulse 1s infinite}

/* ===== الخريطة ===== */
.hero{display:flex;align-items:center;gap:12px;margin:18px 0 6px;padding:16px 18px;border-radius:30px;
  background:linear-gradient(135deg,rgba(255,255,255,.95),rgba(255,255,255,.75));box-shadow:0 10px 0 rgba(124,77,255,.25),0 16px 30px rgba(60,40,140,.2)}
.hero .big{font-size:64px;filter:drop-shadow(0 8px 6px rgba(0,0,0,.25));animation:floaty 3s ease-in-out infinite}
.hero h2{margin:0;font-size:30px;line-height:1.25}
.hero p{margin:2px 0 0;font-size:20px;color:var(--soft)}
.map{position:relative;margin:24px auto 10px;max-width:560px}
.map svg.path{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.node{position:relative;z-index:1;display:flex;align-items:center;gap:14px;margin:0 0 26px;cursor:pointer;user-select:none}
.node:nth-child(odd){flex-direction:row}
.node:nth-child(even){flex-direction:row-reverse;text-align:left}
.orb{width:116px;height:116px;flex:0 0 116px;border-radius:50%;display:grid;place-items:center;font-size:56px;position:relative;
  background:radial-gradient(circle at 32% 28%,#fff 0,var(--oc,#ff8fc2) 35%,var(--od,#e23d8b) 100%);
  box-shadow:0 12px 0 var(--os,#a3165b),0 18px 26px rgba(0,0,0,.28), inset 0 -10px 20px rgba(0,0,0,.15);
  transition:transform .15s;animation:bob 3.2s ease-in-out infinite}
.orb .num{position:absolute;top:-8px;inset-inline-end:-6px;width:40px;height:40px;border-radius:50%;background:#fff;color:var(--ink);font-size:22px;font-weight:800;display:grid;place-items:center;box-shadow:0 4px 0 #cfc6f5}
.node:active .orb{transform:translateY(8px) scale(.97)}
.node .lbl{background:#fff;border-radius:22px;padding:10px 16px;font-size:24px;font-weight:800;box-shadow:0 6px 0 rgba(0,0,0,.08),0 10px 18px rgba(0,0,0,.12);max-width:60%}
.node .lbl small{display:block;font-size:20px;color:#f5a400;letter-spacing:2px}
.node.locked .orb{filter:grayscale(1) brightness(1.1);animation:none}
.node.locked .lbl{opacity:.7}
.node.locked .orb::after{content:"🔒";position:absolute;font-size:38px;bottom:-6px;inset-inline-start:-4px}
.node.cur .orb{animation:bob 3.2s ease-in-out infinite, glow 1.6s infinite}

/* ===== الصفحات ===== */
.page{display:none;animation:pop .35s}
.page.on{display:block}
.stagehead{display:flex;align-items:center;gap:10px;margin:16px 0 10px}
.stagehead .t{flex:1;font-size:30px;font-weight:800;line-height:1.2;text-shadow:0 3px 0 #fff}
.panel{background:rgba(255,255,255,.95);border-radius:var(--r);padding:18px;margin:12px 0;box-shadow:0 10px 0 rgba(124,77,255,.18),0 16px 30px rgba(60,40,140,.18);position:relative}
.instr{display:flex;align-items:center;gap:8px;font-size:24px;font-weight:700;background:linear-gradient(90deg,#fff7d6,#fff);border-radius:20px;padding:10px 14px;margin:0 0 14px;box-shadow:inset 0 -4px 0 #ffe08a}
.instr .ic{font-size:30px}

/* ===== المشهد الكرتوني ===== */
.cine{position:relative;border-radius:30px;overflow:hidden;aspect-ratio:16/10;max-height:62vh;width:100%;perspective:900px;
  box-shadow:0 12px 0 #3b2a8a,0 18px 34px rgba(0,0,0,.35);border:6px solid #fff;background:#9be7ff}
.cine .bg{position:absolute;inset:0;transition:background 1s}
.bg-sky{background:linear-gradient(180deg,#6fd6ff 0%,#bdf0ff 60%,#9be58b 60.5%,#55c25a 100%)}
.bg-room{background:linear-gradient(180deg,#ffe3b3 0%,#ffd08a 62%,#c98b56 62.5%,#a8693a 100%)}
.bg-desert{background:linear-gradient(180deg,#ffb36b 0%,#ffe0a3 55%,#f3c26b 55.5%,#d99a3e 100%)}
.bg-night{background:linear-gradient(180deg,#1b1f5e 0%,#4b3ea8 60%,#2c6e49 60.5%,#1f4d35 100%)}
.bg-mosque{background:linear-gradient(180deg,#a0e9ff 0%,#e4f8ff 58%,#f1e3c6 58.5%,#d9c094 100%)}
.bg-garden{background:linear-gradient(180deg,#8ee3ff 0%,#d8f7ff 55%,#7ddc6e 55.5%,#3faa4a 100%)}
.bg-bath{background:linear-gradient(180deg,#bdeeff 0%,#e9fbff 60%,#cfe7f5 60.5%,#9cc6df 100%)}
.bg-school{background:linear-gradient(180deg,#fff2c9 0%,#ffe7a1 62%,#c9a27a 62.5%,#a07a52 100%)}
.cine .sun{position:absolute;top:8%;inset-inline-end:8%;width:14%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff7b0,#ffd23f 60%,#ffab00);box-shadow:0 0 40px #ffe066;animation:spin 18s linear infinite}
.cine .cloud{position:absolute;font-size:min(9vw,70px);opacity:.95;animation:drift 22s linear infinite;filter:drop-shadow(0 6px 4px rgba(0,0,0,.08))}
.cine .floor{position:absolute;left:-10%;right:-10%;bottom:-18%;height:46%;border-radius:50%;background:radial-gradient(ellipse at 50% 30%,rgba(255,255,255,.35),transparent 60%)}
.cine .props{position:absolute;inset:0}
.cine .props span{position:absolute;filter:drop-shadow(0 10px 8px rgba(0,0,0,.25))}
.actor{position:absolute;bottom:22%;transform-origin:50% 100%;transition:left 1.6s ease-in-out, bottom 1s;z-index:2}
.actor .e{display:block;font-size:min(16vw,120px);line-height:1;filter:drop-shadow(0 14px 8px rgba(0,0,0,.3));transform-style:preserve-3d}
.actor::after{content:"";position:absolute;left:12%;right:12%;bottom:-6px;height:14px;border-radius:50%;background:rgba(0,0,0,.22);filter:blur(3px);z-index:-1}
.a-bounce .e{animation:bounce .9s ease-in-out infinite}
.a-wave .e{animation:wave 1.2s ease-in-out infinite}
.a-jump .e{animation:jump 1s ease-in-out infinite}
.a-float .e{animation:floaty 2.4s ease-in-out infinite}
.a-spin .e{animation:spin3d 2.4s linear infinite}
.a-shake .e{animation:shake .5s ease-in-out infinite}
.a-walk .e{animation:walk .5s ease-in-out infinite}
.a-pulse .e{animation:pulse 1.2s ease-in-out infinite}
.a-fly .e{animation:fly 3s ease-in-out infinite}
.bubble{position:absolute;top:5%;left:5%;right:5%;margin:auto;max-width:86%;background:#fff;border-radius:26px;padding:10px 16px;font-size:clamp(19px,3.4vw,28px);font-weight:700;line-height:1.5;text-align:center;
  box-shadow:0 8px 0 rgba(0,0,0,.12),0 12px 20px rgba(0,0,0,.18);animation:pop .4s;z-index:5}
.bubble .ay{font-family:"Amiri",serif;font-size:1.08em;color:#0b7a44}
.cine .ctrl{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:6}
.cine .ctrl .ibtn{width:48px;height:48px;font-size:24px;opacity:.92}
.cine .dots{position:absolute;top:auto;bottom:74px;left:0;right:0;display:flex;justify-content:center;gap:6px;z-index:6}
.cine .dots i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.6);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.cine .dots i.on{background:#ffd23f;transform:scale(1.3)}
.cine .playbig{position:absolute;inset:0;margin:auto;width:130px;height:130px;border-radius:50%;border:0;font-size:60px;z-index:7;
  background:radial-gradient(circle at 35% 30%,#fff,#ff7eb6 45%,#e2186f);box-shadow:0 10px 0 #9c0f4c,0 18px 30px rgba(0,0,0,.35);animation:pulse 1.4s infinite;color:#fff}

/* ===== بطاقات التعلّم ===== */
.learn{display:grid;gap:14px}
.lcard{display:flex;align-items:center;gap:14px;background:#fff;border-radius:26px;padding:14px;box-shadow:0 8px 0 var(--lc,#ffd1e6),0 12px 20px rgba(0,0,0,.1);animation:pop .4s backwards}
.lcard .pic{font-size:62px;width:96px;height:96px;flex:0 0 96px;border-radius:24px;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff,var(--lc,#ffd1e6));filter:drop-shadow(0 6px 4px rgba(0,0,0,.12))}
.lcard .tx{flex:1;font-size:26px;font-weight:700;line-height:1.55}
.ayahbox{background:linear-gradient(180deg,#f2fff6,#dff8e8);border:4px dashed #6fd39a;border-radius:26px;padding:14px;text-align:center;margin:10px 0}
.ayahbox .ay{font-family:"Amiri",serif;font-size:30px;line-height:2.1;color:#075e36}
.ayahbox .ay span.w{padding:2px 4px;border-radius:10px;transition:background .2s}
.ayahbox .ay span.w.hl{background:#fff27a;box-shadow:0 3px 0 #e6c400}
.an{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#fff;border:3px solid #6fd39a;font-size:18px;font-family:"Baloo Bhaijaan 2";color:#0b7a44;vertical-align:middle}

/* ===== الألعاب ===== */
.qtext{font-size:28px;font-weight:800;text-align:center;margin:4px 0 14px;line-height:1.5;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.qpic{font-size:90px;text-align:center;filter:drop-shadow(0 10px 8px rgba(0,0,0,.25));animation:floaty 3s ease-in-out infinite;margin:-4px 0 6px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px}
.opt{border:0;border-radius:28px;padding:14px 10px;background:linear-gradient(180deg,#fff,#f1edff);
  box-shadow:0 9px 0 #c7bdf5,0 14px 22px rgba(0,0,0,.14);transition:transform .1s;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:120px;justify-content:center}
.opt .e{font-size:64px;line-height:1;filter:drop-shadow(0 6px 4px rgba(0,0,0,.18))}
.opt .t{font-size:24px;font-weight:800;line-height:1.35}
.opt.txt .t{font-size:26px}
.opt:active{transform:translateY(7px);box-shadow:0 2px 0 #c7bdf5}
.opt.ok{background:linear-gradient(180deg,#bbf7d0,#4ade80);box-shadow:0 9px 0 var(--okd),0 14px 22px rgba(0,0,0,.14);animation:jump .6s}
.opt.no{background:linear-gradient(180deg,#ffd0d0,#ff9b9b);box-shadow:0 9px 0 var(--badd);animation:shake .45s}
.opt.dim{opacity:.45;pointer-events:none}
.progress-dots{display:flex;justify-content:center;gap:8px;margin:0 0 12px}
.progress-dots i{width:18px;height:18px;border-radius:50%;background:#e4defc;box-shadow:inset 0 -3px 0 rgba(0,0,0,.1)}
.progress-dots i.ok{background:#4ade80}.progress-dots i.no{background:#ffb020}.progress-dots i.cur{background:#a78bfa;transform:scale(1.25)}

/* فرز */
.sortbox{display:flex;flex-direction:column;align-items:center;gap:18px}
.sortitem{font-size:26px;font-weight:800;background:#fff;border-radius:28px;padding:14px 22px;box-shadow:0 9px 0 #ffd36b,0 14px 22px rgba(0,0,0,.15);text-align:center;animation:pop .35s;min-width:60%}
.sortitem .e{display:block;font-size:84px;line-height:1.05;filter:drop-shadow(0 8px 6px rgba(0,0,0,.2))}
.sortitem.fly-l{animation:flyL .5s forwards}.sortitem.fly-r{animation:flyR .5s forwards}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:100%}
.bin{border:0;border-radius:30px 30px 40px 40px;padding:16px 8px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#fff;font-size:24px;font-weight:800;
  background:linear-gradient(180deg,var(--bc1),var(--bc2));box-shadow:0 10px 0 var(--bcs),0 16px 24px rgba(0,0,0,.22);text-shadow:0 2px 0 rgba(0,0,0,.2)}
.bin .e{font-size:62px;line-height:1}
.bin:active{transform:translateY(8px);box-shadow:0 2px 0 var(--bcs)}
.bin.g{--bc1:#5ee88f;--bc2:#16a34a;--bcs:#166534}.bin.r{--bc1:#ff9a8b;--bc2:#f0444b;--bcs:#a3131a}
.bin.b{--bc1:#7cd3ff;--bc2:#1e88e5;--bcs:#0d5aa7}.bin.o{--bc1:#ffc56b;--bc2:#ff8a00;--bcs:#b55a00}
.bin.hit{animation:jump .5s}.bin.miss{animation:shake .45s}

/* مطابقة */
.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mcol{display:flex;flex-direction:column;gap:12px}
.mi{border:0;border-radius:24px;padding:10px;min-height:86px;background:linear-gradient(180deg,#fff,#fff3f9);box-shadow:0 8px 0 #ffc2dc,0 12px 18px rgba(0,0,0,.1);font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;line-height:1.3}
.mi .e{font-size:46px}
.mi.sel{background:linear-gradient(180deg,#fff6bf,#ffe066);box-shadow:0 8px 0 #e3b400;transform:scale(1.04)}
.mi.done{background:linear-gradient(180deg,#d1fae5,#86efac);box-shadow:0 8px 0 #22a35a;pointer-events:none;animation:jump .5s}
.mi.no{animation:shake .45s}

/* ترتيب */
.slots{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:16px}
.slot{min-width:120px;min-height:96px;border-radius:24px;border:4px dashed #b8a8ff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#8a7bd0;background:rgba(255,255,255,.6);padding:6px}
.slot .e{font-size:40px}
.slot.full{border-style:solid;border-color:#4ade80;background:#ecfdf3;color:var(--ink);animation:pop .3s}
.slot b{font-size:26px}

/* بالونات */
.sky{position:relative;height:440px;border-radius:30px;overflow:hidden;background:linear-gradient(180deg,#7fd8ff,#dff6ff);box-shadow:inset 0 -12px 0 rgba(255,255,255,.6),0 10px 0 #4aa6d6}
.balloon{position:absolute;bottom:-150px;width:120px;text-align:center;border:0;background:none;padding:0;animation:rise linear forwards}
.balloon .b{display:grid;place-items:center;width:112px;height:132px;margin:auto;border-radius:50% 50% 46% 46%;font-size:20px;font-weight:800;color:#fff;line-height:1.25;padding:10px;text-shadow:0 2px 0 rgba(0,0,0,.25);
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.85) 0 8%,var(--bl) 30%,var(--bd) 100%);box-shadow:inset -8px -10px 18px rgba(0,0,0,.18),0 10px 16px rgba(0,0,0,.2)}
.balloon .b .e{font-size:40px;display:block}
.balloon::after{content:"";display:block;width:2px;height:40px;margin:-2px auto 0;background:#666}
.balloon.popd{animation:popb .3s forwards!important}
.sky .score{position:absolute;top:10px;inset-inline-start:12px;background:#fff;border-radius:16px;padding:4px 12px;font-size:22px;font-weight:800;z-index:3;box-shadow:0 4px 0 rgba(0,0,0,.1)}

/* ذاكرة */
.mem{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px;perspective:800px}
.mc{aspect-ratio:3/4;border:0;padding:0;background:none;position:relative;transform-style:preserve-3d;transition:transform .5s}
.mc.flip,.mc.done{transform:rotateY(180deg)}
.mc .f,.mc .k{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 7px 0 rgba(0,0,0,.18)}
.mc .f{background:radial-gradient(circle at 35% 30%,#fff 0,var(--a) 50%,var(--b));font-size:44px;color:#fff}
.mc .k{transform:rotateY(180deg);background:#fff;font-size:18px;font-weight:800;padding:6px;line-height:1.25;text-align:center}
.mc .k .e{font-size:42px}
.mc.done .k{background:linear-gradient(180deg,#d1fae5,#86efac)}

/* إكمال الآية */
.ayrow{font-family:"Amiri",serif;font-size:32px;line-height:2.2;text-align:center;color:#075e36;background:#f2fff6;border-radius:24px;padding:10px;border:4px dashed #6fd39a;margin-bottom:14px}
.gap{display:inline-block;min-width:110px;border-bottom:5px dotted #ff8a00;color:#ff8a00}
.gap.fill{border:0;color:#0b7a44;background:#fff27a;border-radius:12px;padding:0 8px;animation:pop .3s}
.opt.ayw .t{font-family:"Amiri",serif;font-size:30px}

/* نهاية المحطة */
.finish{text-align:center;padding:10px}
.finish .stars{font-size:62px;letter-spacing:6px;filter:drop-shadow(0 6px 4px rgba(0,0,0,.2))}
.finish .stars span{display:inline-block;animation:starpop .6s backwards}
.finish h3{font-size:32px;margin:6px 0}

/* النتائج */
.restable{width:100%;border-collapse:separate;border-spacing:0 8px;font-size:22px}
.restable td{background:#f6f3ff;padding:8px 12px}
.restable td:first-child{border-radius:0 16px 16px 0}.restable td:last-child{border-radius:16px 0 0 16px;text-align:center;font-weight:800;width:100px;white-space:nowrap}
.sent{font-size:24px;font-weight:800;text-align:center;background:#dcfce7;color:#166534;border-radius:20px;padding:12px}

/* التميمة */
.mascot{position:fixed;bottom:12px;inset-inline-start:10px;z-index:40;display:flex;align-items:flex-end;gap:6px;pointer-events:none;transform:translateY(160%);transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
.mascot.on{transform:none}
.mascot svg{width:96px;height:96px;filter:drop-shadow(0 10px 8px rgba(0,0,0,.3))}
.mascot .msg{background:#fff;border-radius:22px 22px 22px 4px;padding:10px 16px;font-size:24px;font-weight:800;box-shadow:0 6px 0 rgba(0,0,0,.1),0 10px 18px rgba(0,0,0,.18);margin-bottom:56px;max-width:60vw}
.blink{animation:blink 4s infinite;transform-origin:center}
.toast{position:fixed;top:90px;left:50%;transform:translate(-50%,-30px);opacity:0;z-index:50;background:#2b2350;color:#fff;padding:10px 18px;border-radius:18px;font-size:20px;font-weight:700;transition:.3s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;top:-30px;width:14px;height:20px;border-radius:4px;animation:fall linear forwards}
.burst{position:fixed;z-index:61;pointer-events:none;font-size:44px;animation:burst .9s forwards}

/* دليل المعلم */
.guide{font-size:19px;line-height:1.7}
.guide table{width:100%;border-collapse:collapse;margin:8px 0}
.guide td,.guide th{border:1px solid #ddd;padding:6px;vertical-align:top}

/* ===== الحركات ===== */
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes bump{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
@keyframes bounce{0%,100%{transform:translateY(0) scaleY(1)}40%{transform:translateY(-22%) scaleY(1.04)}80%{transform:translateY(0) scaleY(.92)}}
@keyframes jump{0%,100%{transform:translateY(0)}35%{transform:translateY(-16px) rotate(-3deg)}65%{transform:translateY(-6px) rotate(2deg)}}
@keyframes wave{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spin3d{to{transform:rotateY(360deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes walk{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes fly{0%,100%{transform:translate(0,0) rotate(-6deg)}25%{transform:translate(-30px,-24px) rotate(6deg)}50%{transform:translate(0,-40px) rotate(-6deg)}75%{transform:translate(30px,-20px) rotate(6deg)}}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
@keyframes glow{0%,100%{box-shadow:0 12px 0 var(--os,#a3165b),0 18px 26px rgba(0,0,0,.28),0 0 0 0 rgba(255,230,80,.9)}50%{box-shadow:0 12px 0 var(--os,#a3165b),0 18px 26px rgba(0,0,0,.28),0 0 0 16px rgba(255,230,80,0)}}
@keyframes rise{to{transform:translateY(-640px)}}
@keyframes popb{to{transform:scale(1.6);opacity:0}}
@keyframes flyL{to{transform:translate(-40vw,40vh) scale(.2);opacity:0}}
@keyframes flyR{to{transform:translate(40vw,40vh) scale(.2);opacity:0}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes burst{0%{transform:scale(.3);opacity:1}100%{transform:scale(2.2) translateY(-60px);opacity:0}}
@keyframes starpop{0%{transform:scale(0) rotate(-90deg)}80%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}

@media (max-width:560px){
  header h1{font-size:19px}
  .pill{font-size:17px;padding:3px 10px}

  .bin{min-height:120px;font-size:20px}.bin .e{font-size:48px}

}
/* أشكال ثلاثية الأبعاد في الخلفية */
.blobs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blobs i{position:absolute;border-radius:50%;opacity:.55;animation:floaty 7s ease-in-out infinite;
  background:radial-gradient(circle at 30% 28%,#fff 0,var(--bc) 38%,var(--bd) 100%);box-shadow:inset -10px -14px 24px rgba(0,0,0,.15),0 20px 30px rgba(60,40,140,.15)}
.blobs i:nth-child(1){width:90px;height:90px;top:18%;left:-20px;--bc:#ff9ccf;--bd:#e23d8b}
.blobs i:nth-child(2){width:60px;height:60px;top:55%;right:-12px;--bc:#9fe0ff;--bd:#1e88e5;animation-delay:-2s}
.blobs i:nth-child(3){width:46px;height:46px;bottom:8%;left:12%;--bc:#ffe28a;--bd:#ff9d00;animation-delay:-4s}
.blobs i:nth-child(4){width:120px;height:120px;top:80%;right:20%;--bc:#c9b3ff;--bd:#7c4dff;opacity:.35;animation-delay:-1s}
.blobs b{position:absolute;width:70px;height:70px;top:35%;left:8%;opacity:.45;border-radius:18px;transform:rotate(20deg);background:linear-gradient(135deg,#a7f3d0,#22c55e);box-shadow:0 14px 0 #15803d55;animation:spin 30s linear infinite}

/* =====================================================================
   هوية الصف الثالث: «جزيرة الكنوز» — بحر فيروزي مشمس، رمل ذهبي،
   فقاعات لامعة ثلاثية الأبعاد، لوحات خشبية، وسمكة مرافقة
   ===================================================================== */
:root{--ink:#123a4a;--soft:#3f6b78;--r:28px}
body{
  background:
    radial-gradient(520px 320px at 88% 6%, rgba(255,241,150,.95), transparent 60%),
    linear-gradient(180deg,#7fe3f5 0%,#b6f2fb 38%,#e4fbff 62%,#fff1c9 82%,#ffe1a1 100%);
  background-attachment:fixed;
}
body::before{
  background-image:
    radial-gradient(circle at 30% 30%, rgba(255,255,255,.95) 0 3px, rgba(255,255,255,.25) 4px, transparent 6px),
    radial-gradient(circle at 30% 30%, rgba(255,255,255,.9) 0 2px, rgba(255,255,255,.2) 3px, transparent 4px);
  background-size:140px 160px, 90px 110px; background-position:0 0, 45px 60px;
  opacity:.7; animation:bubbleup 14s linear infinite}
@keyframes bubbleup{from{background-position:0 0,45px 60px}to{background-position:0 -640px,45px -380px}}
header.top{background:linear-gradient(180deg,#ffffff,#effcff);border-bottom:6px solid #ffd166;box-shadow:0 6px 0 #f4a259,0 10px 20px rgba(0,80,110,.18)}
header h1{background:linear-gradient(90deg,#0077b6,#00b4d8 45%,#f77f00);-webkit-background-clip:text;background-clip:text;color:transparent}
.ibtn{background:linear-gradient(180deg,#ffd166,#f4a259);color:#fff;box-shadow:0 5px 0 #c96f2a,0 8px 14px rgba(0,0,0,.15)}
.ibtn:active{box-shadow:0 1px 0 #c96f2a}
.pill{background:linear-gradient(180deg,#fff8d6,#ffd166);box-shadow:0 4px 0 #e09f3e,0 6px 12px rgba(0,0,0,.12)}

/* البطل: لوحة خشبية */
.hero{border-radius:30px;background:linear-gradient(180deg,#fffaf0,#fff1d6);border:5px solid #e0a96d;
  box-shadow:0 10px 0 #b9794a,0 18px 28px rgba(0,60,90,.18)}
.hero h2{color:#7a3e12;text-shadow:0 2px 0 #fff}
.hero .big{width:96px;height:96px;flex:0 0 96px;display:grid;place-items:center;border-radius:50%;font-size:54px;
  background:radial-gradient(circle at 30% 26%,#fff 0,#bff4ff 35%,#48cae4 80%,#0096c7);box-shadow:inset -8px -10px 16px rgba(0,60,100,.25),0 8px 0 #0077b6}

/* الخريطة: طريق الكنز المتعرّج على الرمل */
.map::before{content:"";position:absolute;top:50px;bottom:40px;left:50%;width:8px;margin-left:-4px;z-index:0;border-radius:8px;
  background:repeating-linear-gradient(180deg,#e63946 0 16px,transparent 16px 30px)}
.node{justify-content:center}
.node:nth-child(odd){flex-direction:row;padding-inline-end:22%}
.node:nth-child(even){flex-direction:row-reverse;padding-inline-start:22%}
.orb{border-radius:50%;
  background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.98) 0 10%,var(--oc) 34%,var(--od) 78%,var(--os) 100%);
  box-shadow:inset -12px -14px 24px rgba(0,0,0,.2),inset 10px 10px 18px rgba(255,255,255,.55),0 0 0 6px rgba(255,255,255,.7),0 12px 0 rgba(0,90,120,.25),0 18px 26px rgba(0,60,90,.25)}
.orb::after{content:"";position:absolute;width:22%;height:14%;top:14%;left:22%;border-radius:50%;background:rgba(255,255,255,.85);transform:rotate(-30deg);pointer-events:none}
.orb .ring{display:none}
.orb .num{background:linear-gradient(180deg,#fff,#ffe3a3);box-shadow:0 4px 0 #e09f3e;color:#7a3e12}
.node .lbl{background:linear-gradient(180deg,#f9dcb0,#e9b97f);color:#5a2a08;border-radius:16px;border:3px solid #b9794a;
  box-shadow:0 6px 0 #8a5530,0 10px 16px rgba(0,0,0,.15);position:relative}
.node .lbl::before,.node .lbl::after{content:"";position:absolute;top:50%;width:8px;height:8px;border-radius:50%;background:#8a5530;margin-top:-4px}
.node .lbl::before{inset-inline-start:6px}.node .lbl::after{inset-inline-end:6px}
.node .lbl small{color:#b5179e}
.node.cur .orb::before{content:"⛵";position:absolute;top:-34px;inset-inline-start:-18px;font-size:44px;animation:sail 2s ease-in-out infinite;filter:drop-shadow(0 6px 4px rgba(0,0,0,.25));z-index:3}
@keyframes sail{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-8px) rotate(6deg)}}
@keyframes glow{0%,100%{box-shadow:inset -12px -14px 24px rgba(0,0,0,.2),0 0 0 6px rgba(255,255,255,.7),0 12px 0 rgba(0,90,120,.25),0 0 0 0 rgba(255,209,102,.95)}50%{box-shadow:inset -12px -14px 24px rgba(0,0,0,.2),0 0 0 6px rgba(255,255,255,.7),0 12px 0 rgba(0,90,120,.25),0 0 0 20px rgba(255,209,102,0)}}
.node.locked .orb{filter:grayscale(.75) brightness(1.15)}

/* اللوحات */
.stagehead .t{color:#023e8a;text-shadow:0 3px 0 #fff,0 0 14px #fff}
.panel{border-radius:32px;background:#fff;border:4px solid #fff;
  box-shadow:0 0 0 5px color-mix(in srgb,var(--a) 28%,#bdf1ff),0 12px 0 #48cae4,0 20px 32px rgba(0,80,110,.18)}
.instr{background:linear-gradient(90deg,#e0f9ff,#fff);box-shadow:inset 0 -5px 0 #90e0ef;border-radius:22px}
.lcard{border-radius:28px;border:3px solid var(--lc);box-shadow:0 8px 0 var(--lc),0 14px 22px rgba(0,80,110,.1)}
.lcard .pic{border-radius:40% 60% 55% 45% / 50% 45% 55% 50%;background:radial-gradient(circle at 30% 26%,#fff,var(--lc) 70%);box-shadow:inset -6px -8px 14px rgba(0,0,0,.08)}

/* الخيارات: أصداف ملوّنة */
.opt{border-radius:30px 30px 22px 22px;background:linear-gradient(180deg,#fff,var(--tc1,#e6fbff));box-shadow:0 9px 0 var(--tc2,#7ad3ea),0 14px 22px rgba(0,80,110,.14);border:3px solid #fff}
.opt:nth-child(4n+1){--tc1:#e3fbff;--tc2:#4cc9f0}
.opt:nth-child(4n+2){--tc1:#fff0e5;--tc2:#f4a259}
.opt:nth-child(4n+3){--tc1:#fde7f3;--tc2:#f78fb3}
.opt:nth-child(4n+4){--tc1:#e9fbe6;--tc2:#80d468}
.opt:active{box-shadow:0 2px 0 var(--tc2)}
.mi{border-radius:24px;background:linear-gradient(180deg,#fff,#eafbff);box-shadow:0 8px 0 #90e0ef,0 12px 18px rgba(0,80,110,.1)}
.sortitem{border-radius:30px;box-shadow:0 0 0 4px #ffe3a3,0 10px 0 #e09f3e,0 16px 24px rgba(0,0,0,.14)}
.slot{border-color:#48cae4;color:#0077b6}
.progress-dots i.cur{background:#f77f00}

/* المشهد: إطار خشبي بحبال */
.cine{border:0;border-radius:30px;box-shadow:0 0 0 6px #fff,0 0 0 13px #c98a55,0 0 0 16px #8a5530,0 20px 34px rgba(0,60,90,.25)}
.cine .playbig{background:radial-gradient(circle at 35% 30%,#fff,#48cae4 45%,#0077b6);box-shadow:0 10px 0 #023e8a,0 18px 30px rgba(0,0,0,.3)}
.cine .dots i.on{background:#f77f00}
.bubble{border-radius:28px;border:4px solid #90e0ef}

/* البالونات: فقاعات تحت الماء */
.sky{background:linear-gradient(180deg,#90e0ef,#48cae4 60%,#0096c7);box-shadow:inset 0 -14px 0 #ffd89a,0 10px 0 #0077b6}
.sky::after{content:"🐠 🐟 🐡";position:absolute;bottom:18px;left:10px;font-size:30px;opacity:.85;animation:swim 9s linear infinite}
@keyframes swim{from{transform:translateX(-20%)}to{transform:translateX(110%)}}

/* الخلفية: فقاعات وأسماك */
.blobs i{opacity:.65;background:radial-gradient(circle at 30% 26%,#fff 0 12%,rgba(255,255,255,.35) 30%,var(--bc) 70%,var(--bd) 100%);border:2px solid rgba(255,255,255,.8);animation:floaty 6s ease-in-out infinite}
.blobs i:nth-child(1){--bc:#bdf3ff;--bd:#48cae4}
.blobs i:nth-child(2){--bc:#ffd9b0;--bd:#f4a259}
.blobs i:nth-child(3){--bc:#ffe9a8;--bd:#ffd166}
.blobs i:nth-child(4){--bc:#cfeaff;--bd:#0096c7;opacity:.4}
.blobs b{background:none;box-shadow:none;border-radius:0;width:auto;height:auto;font-size:50px;opacity:.95;top:62%;animation:fishswim 16s linear infinite}
.blobs b::before{content:"🐠"}
@keyframes fishswim{0%{transform:translateX(-20vw) scaleX(-1)}100%{transform:translateX(120vw) scaleX(-1)}}

.mascot .msg{border-radius:24px 24px 24px 6px;background:#fff;border:3px solid #48cae4}
.toast{background:linear-gradient(90deg,#0077b6,#00b4d8)}
.restable td{background:#eafbff}

.arr{position:absolute;top:44%;z-index:5;border:0;width:48px;height:48px;border-radius:50%;font-size:34px;line-height:1;color:#fff;background:linear-gradient(180deg,#48cae4,#0077b6);box-shadow:0 5px 0 #023e8a}

.stagehead{justify-content:center}

const TTS = {voice:null, ok:'speechSynthesis' in window, warned:false, btn:null, audio:null};
function pickVoice() {
  if (!TTS.ok) return null;
  const vs = speechSynthesis.getVoices();
  TTS.voice = vs.find(v => /^ar[-_](SA|AE|QA|EG)/i.test(v.lang) && /google|natural|online/i.test(v.name)) || vs.find(v => /^ar/i.test(v.lang)) || null;
  return TTS.voice;
}
if (TTS.ok) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
const clean = s => String(s || '').replace(/<[^>]+>/g, ' ').replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu, ' ').replace(/[﴿﴾«»"]/g, '').replace(/ﷺ/g, ' صلى الله عليه وسلم ').replace(/\s+/g, ' ').trim();
function stopVoice() {
  try { if (TTS.ok) speechSynthesis.cancel(); } catch (e) {}
  if (TTS.audio) { TTS.audio.onended = null; TTS.audio.pause(); }
  if (TTS.btn) TTS.btn.classList.remove('on'); TTS.btn = null;
}
function speak(text, btn) {
  return new Promise(res => {
    stopVoice();
    const t = clean(text);
    if (AU.mute || !t) return res(false);
    if (!TTS.ok || !(TTS.voice || pickVoice())) {
      if (!TTS.warned) { TTS.warned = true; toast('🔈 لا يوجد صوت عربي في هذا الجهاز، اقرأ مع والديك'); }
      return res(false);
    }
    const u = new SpeechSynthesisUtterance(t);
    u.voice = TTS.voice; u.lang = TTS.voice.lang; u.rate = .85; u.pitch = 1.15;
    let done = false; const fin = () => { if (done) return; done = true; if (btn) btn.classList.remove('on'); res(true); };
    u.onend = fin; u.onerror = fin;
    if (btn) { btn.classList.add('on'); TTS.btn = btn; }
    speechSynthesis.speak(u);
    setTimeout(fin, 2500 + t.length * 140);
  });
}
const REC = 'https://everyayah.com/data/Alafasy_128kbps/';
const p3 = n => String(n).padStart(3, '0');
function recite(s, a, btn) {
  return new Promise(res => {
    stopVoice(); if (AU.mute) return res(false);
    TTS.audio = TTS.audio || new Audio();
    const au = TTS.audio; au.src = REC + p3(s) + p3(a) + '.mp3';
    if (btn) { btn.classList.add('on'); TTS.btn = btn; }
    const fin = () => { au.onended = null; if (btn) btn.classList.remove('on'); res(true); };
    au.onended = fin; au.onerror = () => { toast('تعذّر تشغيل التلاوة، تأكّد من الإنترنت'); fin(); };
    au.play().catch(() => { toast('تعذّر تشغيل التلاوة، تأكّد من الإنترنت'); fin(); });
  });
}

    <p>كل محطة: مشاهد وبطاقات تعليمية، ثم لعبة تُصحَّح آليًّا (8 درجات حسب الإجابات الصحيحة من أول محاولة). الاختبار: 5 أسئلة × 2 = 10. المجموع 50.</p>
    <table><tr><th>المحطة</th><th>اللعبة</th><th>مفتاح الإجابات</th></tr>${L.stations.map((s, i) => `<tr><td>${ARN(i + 1)}. ${s.icon} ${esc(s.title)}</td><td>${GNAME[s.game.type] || ''}</td><td>${gkey(s.game)}</td></tr>`).join('')}
    <tr><td>🎁 الاختبار</td><td>5 أسئلة</td><td>${L.quiz.map(q => `• ${q.q} ← <b>${(O(q.opts[q.a]).e || '') + ' ' + (O(q.opts[q.a]).t || '')}</b>`).join('<br>')}</td></tr></table></div>`;
}

/* ===== خلط ترتيب الخيارات (ثابت لكل سؤال) ===== */
function seededOrder(key, n) {
  let h = 2166136261; for (const ch of String(key)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  const a = Array.from({length:n}, (_, k) => k);
  for (let i = n - 1; i > 0; i--) { h = Math.imul(h ^ (h >>> 13), 1274126177); const j = Math.abs(h) % (i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function mixQ(q) { if (!q || !Array.isArray(q.opts) || typeof q.a !== 'number' || q.fixed) return; const o = seededOrder(q.q + JSON.stringify(q.opts), q.opts.length); q.opts = o.map(k => q.opts[k]); q.a = o.indexOf(q.a); }
L.stations.forEach(s => (s.game.rounds || []).forEach(r => { if (s.game.type === 'pick') mixQ(r); }));
L.quiz.forEach(mixQ);

(function boot() {
  const r = document.documentElement.style;
  Object.entries(L.theme || {}).forEach(([k, v]) => r.setProperty('--' + k, v));
  $('#ltitle').textContent = (L.icon || '') + ' ' + L.title;
  $('#mascot').innerHTML = MASCOT_SVG + '<div class="msg"></div>';
  $('#muteBtn').onclick = () => { AU.mute = !AU.mute; $('#muteBtn').textContent = AU.mute ? '🔇' : '🔊'; if (AU.mute) stopVoice(); };
  if (inFrame) {
    bridgePost({iste:'ready'});
    setTimeout(() => { if (!BR.inited) { BR.mode = 'standalone'; startLesson(LS.get(KEY, null)); } }, 4000);
  } else startLesson(LS.get(KEY, null));
})();
