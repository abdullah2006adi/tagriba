<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>معرض الألعاب الجديدة</title><style>/* ===== G52 ===== */
.g52{--g1:#7c3aed;--g2:#0ea5e9;--g3:#10b981;--g4:#f59e0b;--g5:#ef4444;--gk:#1f2a44;--gm:#6b7280;--gl:#eef2ff;--gb:#fff;text-align:center;color:var(--gk);user-select:none;-webkit-user-select:none}
.g52 *{box-sizing:border-box}
.g52 button{font:inherit;cursor:pointer;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.g52-head{display:flex;gap:12px;align-items:center;text-align:right;background:linear-gradient(135deg,#f5f3ff,#ecfeff);border-radius:20px;padding:10px 14px;margin-bottom:10px;border:2px solid #e0e7ff}
.g52-ic{font-size:44px;line-height:1;filter:drop-shadow(0 3px 3px rgba(0,0,0,.15))}
.g52-ht b{display:block;font-size:1.15em;color:var(--g1)} .g52-ht span{display:block;font-size:.9em;color:#374151;line-height:1.5}
.g52-hud{display:flex;justify-content:center;gap:10px;margin:6px 0;flex-wrap:wrap}
.g52-hud span:not(:empty){background:#1f2a44;color:#fff;border-radius:999px;padding:2px 14px;font-weight:800;font-size:.95em}
.g52-dots{display:flex;justify-content:center;gap:6px;margin:6px 0}
.g52-dots i{width:14px;height:14px;border-radius:50%;background:#e5e7eb;display:block}.g52-dots i.cur{background:var(--g2);transform:scale(1.25)}.g52-dots i.ok{background:var(--g3)}.g52-dots i.no{background:var(--g5)}
.g52-q{font-size:1.15em;font-weight:700;background:#fff;border:2px dashed #c7d2fe;border-radius:16px;padding:10px 14px;margin:8px 0;line-height:1.6}
.g52-qpic{font-size:1.6em;display:block}
.g52-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:8px 0}
.g52-opt{background:#fff;border:3px solid #e0e7ff;border-radius:16px;padding:10px 8px;font-weight:700;font-size:1.05em;box-shadow:0 4px 0 #c7d2fe;transition:transform .12s}
.g52-opt:active{transform:translateY(3px);box-shadow:0 1px 0 #c7d2fe}
.g52-opt:disabled{opacity:.55}
.g52 .ge{font-size:1.5em;display:inline-block;vertical-align:middle;margin-inline-end:4px;line-height:1.1}
.g52 .gt{vertical-align:middle}
.g52-row{display:flex;justify-content:center;gap:10px;margin:10px 0;flex-wrap:wrap}
.g52-btn{background:linear-gradient(180deg,#8b5cf6,#6d28d9);color:#fff!important;border:0;border-radius:999px;padding:8px 22px;font-weight:800;box-shadow:0 5px 0 #4c1d95}
.g52-btn.big{font-size:1.2em;padding:10px 30px}
.g52-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #4c1d95}
.g-ok{animation:gOk .5s}.g-bad{animation:gBad .45s}
@keyframes gOk{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes gBad{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(5px)}}
.g52-opt.g-ok,.g52-opt.g-ok:disabled{background:#dcfce7;border-color:#22c55e;opacity:1}
.g52-opt.g-bad{background:#fee2e2;border-color:#ef4444}

/* السلّم والثعبان */
.g52-lad{display:flex;gap:10px;align-items:center;justify-content:center}
.lad-board{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;background:#fde68a;padding:6px;border-radius:16px;width:min(100%,330px)}
.lc{aspect-ratio:1;border-radius:8px;background:#fff7ed;position:relative;font-size:20px;display:flex;align-items:center;justify-content:center}
.lc:nth-child(odd){background:#fef3c7}.lc small{position:absolute;top:1px;right:3px;font-size:10px;color:#92400e}
.lc.ld{background:#bbf7d0}.lc.sn{background:#fecaca}.lc.me{background:#c7d2fe;box-shadow:0 0 0 3px #6366f1 inset}
.lad-side{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700}.lad-die{font-size:54px;line-height:1}
/* الرماية */
.g52-range{position:relative;height:240px;background:linear-gradient(#bae6fd,#e0f2fe 60%,#86efac 60%);border-radius:20px;overflow:hidden}
.tgt{position:absolute;top:18px;left:0;border:0;background:none;display:flex;flex-direction:column;align-items:center;animation:tgMove 6s ease-in-out infinite alternate;width:46%}
.tgt:nth-child(1){top:6px}.tgt:nth-child(2){top:68px;animation-delay:-2s}.tgt:nth-child(3){top:130px;animation-delay:-4s}.tgt:nth-child(4){top:100px;animation-delay:-3s}
.tgt .ring{font-size:38px;line-height:1}.tgt .lb{background:#fff;border-radius:12px;padding:2px 10px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.15);max-width:100%}
.tgt.hit .ring{animation:gOk .5s}.tgt:disabled{opacity:.45}
@keyframes tgMove{from{transform:translateX(0)}to{transform:translateX(115%)}}
.arrow{position:absolute;bottom:0;left:50%;width:6px;height:36px;background:linear-gradient(#78350f,#d97706);border-radius:3px;animation:arw .38s ease-in forwards}
@keyframes arw{to{left:var(--x);bottom:calc(100% - var(--y))}}
.g52-bow{font-size:40px;margin-top:-6px}
/* الشجرة */
.tr-sky{height:230px;background:linear-gradient(#e0f2fe,#f0fdf4);border-radius:20px;position:relative;overflow:hidden}
.tr-plant{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);line-height:1}.tr-plant.grow{animation:gOk .6s}
.tr-e{transition:font-size .5s;display:block}
.tr-soil{position:absolute;bottom:0;left:0;right:0;height:38px;background:linear-gradient(#a16207,#713f12)}
.fr{position:absolute;font-size:24px}.f1{top:20%;left:15%}.f2{top:30%;right:12%}.f3{top:10%;right:30%}.f4{top:42%;left:30%}
.leaf{position:absolute;top:30%;left:50%;font-size:22px;animation:leafF 1.2s forwards}
@keyframes leafF{to{transform:translate(40px,120px) rotate(200deg);opacity:0}}
/* البيت */
.hs-site{position:relative;height:200px;background:linear-gradient(#dbeafe,#fefce8 75%,#86efac 75%);border-radius:20px;overflow:hidden}
.hp{position:absolute;left:50%;transform:translateX(-50%) scale(.2);opacity:0;transition:.5s}.hp.on{opacity:1;transform:translateX(-50%) scale(1)}
.hp-f{bottom:42px;width:190px;height:14px;background:#78716c;border-radius:4px}
.hp-w1{bottom:56px;width:170px;height:44px;background:repeating-linear-gradient(90deg,#f97316 0 30px,#ea580c 30px 32px)}
.hp-w2{bottom:100px;width:170px;height:40px;background:repeating-linear-gradient(90deg,#fb923c 0 30px,#ea580c 30px 32px)}
.hp-win{bottom:90px;width:120px;height:28px;background:linear-gradient(90deg,#7dd3fc 0 34px,transparent 34px 86px,#7dd3fc 86px);z-index:2}
.hp-door{bottom:56px;width:34px;height:56px;background:#7c2d12;border-radius:16px 16px 0 0;z-index:2}
.hp-roof{bottom:138px;width:0;height:0;border-left:105px solid transparent;border-right:105px solid transparent;border-bottom:52px solid #b91c1c;background:none}
.hp-flag{position:absolute;top:6px;right:12px;font-size:30px}.hp-crane{position:absolute;top:8px;left:10px;font-size:34px}
.g52-opt.brick{background:#fff7ed;border-color:#fdba74;box-shadow:0 4px 0 #fb923c}
/* المتاهة */
.mz-path{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:2px;background:#ecfccb;border-radius:18px;padding:10px;margin-bottom:6px}
.mz-node{width:40px;height:40px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 2px 0 #a3e635}.mz-node.cur{background:#fde68a}.mz-node.pass{background:#bbf7d0}.mz-node.goal{width:auto;padding:0 8px;background:#fef9c3}
.mz-link{width:14px;height:6px;background:#84cc16;border-radius:3px}
.mz-doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.mz-door{background:linear-gradient(#a16207,#713f12);border:0;border-radius:16px 16px 6px 6px;padding:10px 6px;color:#fff!important;font-weight:700;min-height:110px;display:flex;flex-direction:column;align-items:center;gap:6px}
.mz-door .dr{font-size:34px}.mz-door .dl{background:rgba(255,255,255,.92);color:#1f2937;border-radius:10px;padding:2px 8px}
.mz-door.open{background:linear-gradient(#22c55e,#15803d)}.mz-door:disabled{opacity:.6}
/* البولينغ */
.g52-lane{position:relative;height:270px;background:linear-gradient(90deg,#78350f 0 6%,#fbbf24 6% 94%,#78350f 94%);border-radius:18px;overflow:hidden}
.bw-pins{position:absolute;top:10px;left:8%;right:8%;display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.pin{background:none;border:0;display:flex;flex-direction:column;align-items:center;width:44%;transition:.4s}
.pin .pe{font-size:34px}.pin .pl{background:#fff;border-radius:12px;padding:2px 8px;font-weight:700;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.pin.fall{transform:rotate(70deg) translateY(-20px);opacity:.5}.pin:disabled{opacity:.5}
.bw-ball{position:absolute;bottom:12px;left:50%;margin-left:-22px;font-size:44px;transition:transform .5s ease-in}
/* ركلة الجزاء */
.g52-goal{position:relative;height:250px;background:linear-gradient(#0ea5e9 0 18%,#16a34a 18%);border-radius:18px;overflow:hidden}
.gl-net{position:absolute;top:12px;left:8%;right:8%;height:120px;border:6px solid #fff;border-bottom:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.25) 0 2px,transparent 2px 12px),repeating-linear-gradient(-45deg,rgba(255,255,255,.25) 0 2px,transparent 2px 12px);display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:6px}
.zone{background:rgba(255,255,255,.85);border:2px dashed #16a34a;border-radius:10px;font-weight:700;font-size:.95em;padding:2px}
.zone:disabled{opacity:.4}
.gl-keeper{position:absolute;top:84px;left:50%;margin-left:-20px;font-size:40px;transition:transform .45s}
.gl-ball{position:absolute;bottom:14px;left:50%;margin-left:-20px;font-size:40px;transition:transform .45s ease-out}
.gl-score{position:absolute;bottom:8px;right:10px;background:#fff;border-radius:999px;padding:0 10px;font-weight:800}
/* قص الحبل */
.g52-rope{position:relative;height:280px;background:linear-gradient(#fef3c7,#fde68a);border-radius:18px;overflow:hidden}
.rp-hook{position:absolute;top:0;left:50%;width:18px;height:12px;margin-left:-9px;background:#57534e;border-radius:0 0 8px 8px}
.rp-swing{position:absolute;top:10px;left:50%;width:2px;height:150px;transform-origin:top center}
.rp-line{position:absolute;top:0;left:0;width:3px;height:130px;background:#78350f}
.rp-candy{position:absolute;top:120px;left:-20px;font-size:40px;transition:top .5s ease-in}
.rp-swing.drop .rp-line{display:none}.rp-swing.drop .rp-candy{top:220px}
.rp-bins{position:absolute;bottom:6px;left:0;right:0;display:flex;justify-content:space-around;gap:4px;padding:0 4px}
.rp-bin{flex:1;display:flex;flex-direction:column;align-items:center;background:rgba(255,255,255,.7);border-radius:12px;padding:2px}
.rp-bin .bk{font-size:30px}.rp-bin .bl{font-weight:700;font-size:.9em}
/* القفل */
.lk-body{font-size:64px;line-height:1.1}
.lk-row{display:flex;gap:8px;align-items:center;justify-content:space-between;background:#f8fafc;border-radius:14px;padding:6px 10px;margin:6px 0;border:2px solid #e2e8f0}
.lk-q{text-align:right;flex:1;font-weight:600}
.lk-dial{display:flex;flex-direction:column;align-items:center;background:linear-gradient(#334155,#0f172a);border-radius:14px;padding:4px;min-width:130px;max-width:48%}
.lk-dial button{background:#475569;border:0;border-radius:8px;color:#fff!important;width:100%;padding:0}
.lk-val{background:#fff;border-radius:8px;margin:3px 0;padding:4px 6px;font-weight:800;width:100%;min-height:34px}
/* المحقق */
.dt-case{background:#fefce8;border:3px solid #a16207;border-radius:12px;padding:10px;margin:6px 0;box-shadow:4px 4px 0 #ca8a04}
.dt-file{font-weight:800;color:#a16207;text-align:right}.dt-words{font-size:1.15em;line-height:2}
.dt-words .fog{background:#d6d3d1;color:#d6d3d1;border-radius:6px;padding:0 4px}.dt-words .on{font-weight:700}
/* شد الحبل */
.g52-tug{display:flex;align-items:center;gap:6px;background:linear-gradient(#e0f2fe,#dcfce7);border-radius:18px;padding:18px 8px;margin:6px 0}
.tg-me,.tg-ai{font-size:40px}.tg-rope{flex:1;height:10px;background:repeating-linear-gradient(45deg,#a16207 0 6px,#ca8a04 6px 12px);border-radius:5px;position:relative}
.tg-flag{position:absolute;top:-30px;font-size:28px;transform:translateX(-50%);transition:left .2s}
.tg-l,.tg-r{position:absolute;top:-8px;width:4px;height:26px;background:#ef4444}.tg-l{left:12%}.tg-r{right:12%}
/* الحاسبة */
.g52-calc{max-width:300px;margin:6px auto;background:#1f2937;border-radius:22px;padding:12px}
.cl-screen{background:#ecfccb;border-radius:12px;font-size:2em;font-weight:800;padding:4px 14px;text-align:left;direction:ltr;margin-bottom:8px;min-height:52px}
.cl-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cl-k{background:#374151;border:0;border-radius:12px;color:#fff!important;font-size:1.4em;font-weight:800;padding:8px 0}.cl-k.go{background:#16a34a}
/* غرفة الهروب */
.es-doors{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;background:#1e293b;border-radius:16px;padding:10px;margin-bottom:6px}
.es-d{background:#334155;border-radius:10px;padding:4px 8px;font-size:22px}.es-d.cur{background:#f59e0b}.es-d.open{background:#16a34a}.es-d.out{background:#0ea5e9}
.es-lock{font-weight:800;color:#b45309}

/* السماء والبالونات */
.g52-sky{position:relative;height:330px;background:linear-gradient(#bfdbfe,#e0f2fe);border-radius:20px;overflow:hidden}
.g52-sky .bl{position:absolute;bottom:-130px;border:0;background:none;animation:blUp 8s linear forwards;padding:0}
.g52-sky .bl .bb{background:radial-gradient(circle at 30% 30%,#fff8,transparent 40%),var(--c);border-radius:50% 50% 46% 46%;min-width:96px;max-width:150px;min-height:96px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:.9em;box-shadow:inset -6px -8px 0 rgba(0,0,0,.08)}
.g52-sky .bl::after{content:'';display:block;width:2px;height:40px;background:#64748b;margin:0 auto}
.g52-sky .bl.pop{animation:none;transform:scale(1.4);opacity:0;transition:.25s}
@keyframes blUp{to{transform:translateY(-480px)}}
/* البحر والفقاعات */
.g52-sea{position:relative;height:330px;background:linear-gradient(#38bdf8,#0369a1);border-radius:20px;overflow:hidden}
.sea-weed{position:absolute;bottom:0;left:0;right:0;font-size:34px;letter-spacing:40px}.sea-fish{position:absolute;top:40%;left:10%;font-size:34px;animation:tgMove 9s ease-in-out infinite alternate}
.bub{position:absolute;bottom:-60px;border:2px solid rgba(255,255,255,.8);background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.75),rgba(255,255,255,.15) 60%);border-radius:50%;min-width:90px;min-height:90px;max-width:140px;padding:8px;color:#0c4a6e!important;font-weight:800;font-size:.88em;display:flex;align-items:center;justify-content:center;flex-direction:column}
.bub.pop{transform:scale(1.5)!important;opacity:0;transition:.25s}
/* اضرب الصحيح */
.g52-holes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;background:#65a30d;border-radius:20px;padding:12px}
.hole{position:relative;height:108px;overflow:hidden;border-radius:14px}
.hole .dirt{position:absolute;bottom:0;left:0;right:0;height:30px;background:radial-gradient(ellipse at center,#422006,#713f12);border-radius:50%}
.mole{position:absolute;left:4%;right:4%;bottom:-100px;transition:bottom .25s;background:#fef3c7;border-radius:14px 14px 4px 4px;padding:2px;display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:.8em;cursor:pointer;min-height:76px}
.mole .mf{font-size:24px}.mole .ge{font-size:16px}.hole.up .mole{bottom:14px}
/* السلة */
.g52-field{position:relative;height:320px;background:linear-gradient(#fef9c3,#dcfce7);border-radius:20px;overflow:hidden;touch-action:none}
.basket{position:absolute;bottom:8px;font-size:58px;transform:translateX(-50%);transition:left .08s}
.g52-field .fall{position:absolute;transform:translateX(-50%);background:#fff;border-radius:14px;padding:4px 10px;font-weight:800;box-shadow:0 3px 8px rgba(0,0,0,.15);font-size:.9em;max-width:42%}
/* الميزان */
.g52-scale{position:relative;height:200px;margin:4px 0}
.sc-beam{position:absolute;top:30px;left:6%;right:6%;height:8px;background:#92400e;border-radius:4px;transition:transform .5s;display:flex;justify-content:space-between}
.sc-pan{position:relative;top:8px;width:46%;min-height:110px;background:linear-gradient(#fde68a,#f59e0b);border-radius:0 0 50% 50%/0 0 30% 30%;border:0;padding:6px;display:flex;flex-direction:column;justify-content:flex-end;font-weight:800}
.sc-items{min-height:30px}.sc-chip{font-size:20px}
.sc-post{position:absolute;top:30px;left:50%;width:10px;height:160px;margin-left:-5px;background:#78350f;border-radius:5px;z-index:-1}
.sc-card{font-size:1.2em;font-weight:800;background:#fff;border:3px solid #a78bfa;border-radius:16px;padding:10px;margin:6px auto;max-width:420px}
/* صيد السمك */
.g52-pond{position:relative;height:320px;background:linear-gradient(#bae6fd 0 22%,#0284c7 22%,#075985);border-radius:20px;overflow:hidden}
.pd-boat{position:absolute;top:4%;left:44%;font-size:46px}
.fish{position:absolute;border:0;background:none;display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-50%)}
.fish .fe{font-size:40px}.fish .fl{background:#fff;border-radius:10px;padding:0 8px;font-weight:800;font-size:.85em;max-width:150px}
.fish.hooked{transition:.4s;top:10%!important;opacity:.6}
.line{position:absolute;top:12%;width:2px;background:#e2e8f0;transform-origin:top}
/* الفضاء */
.g52-space{position:relative;height:340px;background:radial-gradient(circle at 70% 20%,#312e81,#020617);border-radius:20px;overflow:hidden}
.stars{position:absolute;inset:0;background-image:radial-gradient(2px 2px at 20% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 70% 60%,#fff,transparent),radial-gradient(2px 2px at 40% 80%,#fff,transparent),radial-gradient(1px 1px at 85% 15%,#fff,transparent);animation:sky 6s linear infinite}
@keyframes sky{to{background-position:0 340px}}
.ship{position:absolute;bottom:16px;font-size:46px;transform:translateX(-50%) rotate(-45deg);transition:left .15s;z-index:3}
.lanes{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr)}.lanes button{background:none;border:0;border-left:1px dashed rgba(255,255,255,.12)}
.rock{position:absolute;transform:translateX(-50%);background:rgba(255,255,255,.93);border-radius:14px;padding:2px 8px;font-weight:800;font-size:.85em;max-width:31%;z-index:2;pointer-events:none}
.rock .ge{display:block;font-size:24px;margin:0}.rock .gt{font-size:13px}
/* العداء */
.g52-run{position:relative;height:240px;background:linear-gradient(#bae6fd,#fef9c3);border-radius:20px;overflow:hidden;touch-action:none}
.rn-ground{position:absolute;bottom:0;left:0;right:0;height:30px;background:repeating-linear-gradient(90deg,#65a30d 0 20px,#4d7c0f 20px 40px)}
.rn-man{position:absolute;right:18%;bottom:28px;font-size:46px;transform:scaleX(-1)}
.obs{position:absolute;bottom:30px;border-radius:12px;padding:4px 8px;font-weight:800;font-size:.85em;max-width:40%}
.obs.coin{background:#fde047;border:3px solid #ca8a04;bottom:40px}.obs.wall{background:#fca5a5;border:3px solid #b91c1c}
/* الثعبان */
.sk-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;background:#365314;padding:4px;border-radius:14px;width:min(100%,340px);margin:0 auto}
.sc{aspect-ratio:1;background:#84cc16;border-radius:4px;position:relative;font-size:16px;display:flex;align-items:center;justify-content:center}
.sc.bd{background:#166534;border-radius:8px}.sc.hd{background:#14532d}
.sk-f{position:absolute;z-index:3;background:#fff;border-radius:8px;padding:1px 5px;font-size:11px;font-weight:800;white-space:nowrap;box-shadow:0 0 0 3px #facc15}
.sk-f .ge{font-size:16px}
.sk-pad{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:6px}.sk-pad button{font-size:28px;background:#e0e7ff;border:0;border-radius:12px;width:60px;height:46px;margin:0 6px}
/* تقطيع الفواكه */
.g52-dojo{position:relative;height:330px;background:linear-gradient(#7c2d12,#431407);border-radius:20px;overflow:hidden;touch-action:none}
.frt{position:absolute;transform:translateX(-50%);background:rgba(255,255,255,.95);border-radius:18px;padding:4px 10px;font-weight:800;font-size:.85em;max-width:40%;display:flex;flex-direction:column;align-items:center}
.frt .fe{font-size:32px}.frt.cut{animation:cutA .4s forwards}
@keyframes cutA{to{clip-path:polygon(0 0,100% 0,100% 45%,0 60%);opacity:0;transform:translateX(-50%) rotate(20deg)}}
/* كسر الطوب */
.g52-brk{position:relative;min-height:300px;background:linear-gradient(#1e1b4b,#312e81);border-radius:20px;padding:10px 8px 70px;overflow:hidden}
.bricks{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px}
.g52-brk .brick{background:linear-gradient(#fb923c,#ea580c);border:0;border-radius:6px;padding:8px 4px;color:#fff!important;font-weight:800;font-size:.85em;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}
.g52-brk .brick.gone{visibility:hidden}.g52-brk .brick.steel{background:linear-gradient(#94a3b8,#475569)}
.paddle{position:absolute;bottom:14px;left:50%;width:90px;height:12px;margin-left:-45px;background:#e2e8f0;border-radius:6px}
.ball{position:absolute;bottom:28px;left:50%;width:18px;height:18px;margin-left:-9px;background:#fde047;border-radius:50%;transition:transform .4s ease-out}
/* كرة السلة */
.g52-court{position:relative;height:300px;background:linear-gradient(#fde68a,#f59e0b);border-radius:20px;overflow:hidden}
.hoops{display:flex;justify-content:space-around;gap:6px;padding:10px 6px}
.hoop{background:rgba(255,255,255,.85);border:0;border-radius:14px;padding:4px;display:flex;flex-direction:column;align-items:center;flex:1;animation:tgMove 6s ease-in-out infinite alternate;max-width:46%}
.hoop:nth-child(2){animation-direction:alternate-reverse}.hoop .rim{font-size:34px}
.bball{position:absolute;bottom:14px;left:50%;transform-origin:center;margin-left:-60px;width:120px;display:flex;flex-direction:column;align-items:center;transition:transform .45s cubic-bezier(.3,1.6,.6,1)}
.bball>span{font-size:42px}.bt .ge{font-size:20px}.bt{background:#fff;border-radius:12px;padding:2px 8px;font-weight:800;font-size:.85em}
/* الكشاف */
.g52-dark{position:relative;height:320px;border-radius:20px;overflow:hidden;background:#0b1020;touch-action:none;--lx:100px;--ly:80px}
.hid{position:absolute;background:#fef3c7;border:0;border-radius:12px;padding:4px 8px;font-weight:800;font-size:.85em;max-width:24%}
.hid.found{box-shadow:0 0 0 3px #22c55e}.hid.wrong{box-shadow:0 0 0 3px #ef4444;opacity:.6}
.beam{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle 85px at var(--lx) var(--ly),transparent 0,transparent 70px,rgba(2,6,23,.97) 92px)}
/* الفروق */
.g52-diff{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.df-panel{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:#f1f5f9;border-radius:16px;padding:6px;align-content:start}
.df-cap{grid-column:1/-1;font-weight:800;font-size:.9em}
.df-t{background:#fff;border:2px solid #e2e8f0;border-radius:12px;padding:6px 4px;font-weight:700;font-size:.82em;min-height:56px}
.df-t.circ{box-shadow:0 0 0 4px #ef4444;border-radius:50%}
/* البوصلة */
.cp-rose{position:relative;width:min(100%,330px);aspect-ratio:1;margin:6px auto;border-radius:50%;background:radial-gradient(circle,#fff 0 34%,#e0f2fe 35% 60%,#bae6fd 61%);border:8px solid #0369a1}
.cp-needle{position:absolute;top:18%;left:50%;width:10px;height:32%;margin-left:-5px;background:linear-gradient(#ef4444 50%,#334155 50%);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);transform-origin:50% 100%;transition:transform .35s;top:18%}
.cp-card{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border:3px solid #7c3aed;border-radius:14px;padding:4px 8px;font-weight:800;max-width:44%;font-size:.85em;z-index:2}
.cp-dir{position:absolute;background:#0369a1;color:#fff!important;border:0;border-radius:12px;padding:3px 8px;font-weight:700;font-size:.8em;max-width:40%}
.cp-dir.n{top:-14px;left:50%;transform:translateX(-50%)}.cp-dir.s{bottom:-14px;left:50%;transform:translateX(-50%)}.cp-dir.e{right:-12px;top:50%;transform:translateY(-50%)}.cp-dir.w{left:-12px;top:50%;transform:translateY(-50%)}
/* السوق */
.g52-mkt{background:#fff7ed;border-radius:20px;overflow:hidden;padding-bottom:8px}
.mk-awning{height:26px;background:repeating-linear-gradient(90deg,#ef4444 0 30px,#fff 30px 60px)}
.mk-shelf{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;padding:10px}
.mk-it{background:#fff;border:2px solid #fed7aa;border-radius:14px;padding:6px;font-weight:700;font-size:.88em;position:relative}
.mk-it .tag{position:absolute;top:-6px;left:-4px;font-size:16px}.mk-it.bought{background:#dcfce7;border-color:#22c55e}.mk-it.nope{background:#fee2e2;opacity:.6}
.mk-cart{font-size:40px;min-height:50px}.mk-cart .ci{font-size:22px}
/* الحقيبة */
.g52-pack{display:grid;grid-template-columns:1fr;gap:8px}
.pk-table{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;background:#f5f5f4;border-radius:16px;padding:8px;min-height:60px}
.pk-it{background:#fff;border:2px solid #d6d3d1;border-radius:12px;padding:5px 9px;font-weight:700;font-size:.88em}
.pk-bag{background:linear-gradient(#60a5fa,#2563eb);border-radius:30px 30px 18px 18px;padding:8px}
.pk-top{font-size:30px}.pk-slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:6px}
.pk-s{background:rgba(255,255,255,.3);border:2px dashed #fff;border-radius:12px;min-height:44px}.pk-s.full{background:#fff;border-style:solid;font-weight:700;font-size:.85em}
/* الشبكة */
.gr-ask{font-size:1.1em;margin:4px 0}
.g52-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px}
.gr-t{background:#fff;border:3px solid #e2e8f0;border-radius:14px;padding:8px 4px;font-weight:700;font-size:.88em;min-height:60px}
.gr-t.sel{background:#ede9fe;border-color:#7c3aed}.gr-t.done{color:#fff!important;border-color:transparent}.gr-t.d1{background:#22c55e}.gr-t.d2{background:#0ea5e9}.gr-t.d3{background:#f59e0b}
/* الدخيل */
.g52-odd{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.od-c{background:#fff;border:3px solid #e0e7ff;border-radius:16px;padding:12px 6px;font-weight:700;min-height:70px}
.od-c.caught{background:#fee2e2;border-color:#ef4444;text-decoration:line-through}
/* البطاقة الممسوحة */
.sr-card{position:relative;height:140px;max-width:420px;margin:6px auto;border-radius:18px;background:#fff;border:3px solid #fbbf24;overflow:hidden;touch-action:none}
.sr-txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.15em;font-weight:800;padding:10px}
.sr-card canvas{position:absolute;inset:0;width:100%;height:100%;transition:opacity .4s}
#sb.wait{opacity:.45}
/* الأحجية */
.pz-board{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:4px;background:#e0e7ff;padding:8px;border-radius:18px}
.pz-slot{min-height:64px;border:3px dashed #a5b4fc;border-radius:14px;background:#f8fafc;font-weight:700;font-size:.9em;color:#94a3b8!important}
.pz-slot.full{border-style:solid;color:#1f2937!important;clip-path:polygon(0 0,42% 0,50% 10%,58% 0,100% 0,100% 100%,58% 100%,50% 90%,42% 100%,0 100%)}
.pz-board.whole{box-shadow:0 0 0 5px #22c55e}
.pz-tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.pz-pc{border:0;border-radius:12px;padding:8px 12px;font-weight:700;font-size:.9em;color:#1f2937!important;clip-path:polygon(0 0,42% 0,50% 12%,58% 0,100% 0,100% 100%,0 100%)}
.pz-pc.sel{outline:4px solid #7c3aed;transform:scale(1.06)}.pz-pc.used{visibility:hidden}
.c0{background:#fecaca}.c1{background:#fde68a}.c2{background:#bbf7d0}.c3{background:#bae6fd}.c4{background:#e9d5ff}.c5{background:#fbcfe8}
/* القطار */
.tn-track{display:flex;flex-direction:row-reverse;align-items:flex-end;gap:4px;flex-wrap:wrap-reverse;justify-content:flex-end;background:linear-gradient(transparent 85%,#78716c 85% 90%,transparent 90%);min-height:70px;padding:4px;border-radius:12px}
.tn-track.go{animation:trGo 1.4s ease-in forwards}
@keyframes trGo{to{transform:translateX(-110%)}}
.tn-eng{font-size:46px}.tn-w{background:#3b82f6;color:#fff;border-radius:8px;padding:6px 8px;font-weight:700;font-size:.8em;border-bottom:6px solid #1e3a8a}
.tn-yard{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.tn-car{background:#fef3c7;border:3px solid #f59e0b;border-radius:10px;padding:6px 10px;font-weight:700;border-bottom-width:8px}.tn-car.used{visibility:hidden}
/* الخرز */
.bd-string{display:flex;flex-wrap:wrap;gap:4px;align-items:center;justify-content:flex-start;min-height:60px;background:linear-gradient(transparent 48%,#a16207 48% 52%,transparent 52%);padding:4px}
.bd-on,.bd-b{border-radius:999px;padding:6px 12px;font-weight:700;font-size:.85em;color:#fff!important;background:radial-gradient(circle at 30% 30%,#fff7,transparent 45%),var(--bc);border:0}
.bd-box{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px;background:#f5f5f4;border-radius:16px;padding:10px}.bd-b.used{visibility:hidden}
/* الجبل */
.g52-mtn{background:linear-gradient(#bae6fd,#f0f9ff);border-radius:20px;padding:8px;position:relative}
.mt-peak{font-size:30px}.mt-path{display:flex;flex-direction:column;gap:4px;align-items:center}
.mt-step{min-height:30px;width:80%;background:linear-gradient(90deg,#a8a29e,#78716c);border-radius:10px;color:#fff;font-weight:700;font-size:.85em;padding:3px}.mt-step:nth-child(odd){width:70%}
.mt-step.done{background:linear-gradient(90deg,#22c55e,#15803d)}
.mt-rocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:10px}
.mt-rock{background:#e7e5e4;border:3px solid #a8a29e;border-radius:20px 26px 16px 22px;padding:8px;font-weight:700}
/* التتريس */
.tt-well{position:relative;height:200px;background:repeating-linear-gradient(0deg,#e0e7ff 0 1px,transparent 1px 24px),#1e293b;border-radius:16px;overflow:hidden}
.tt-block{position:absolute;left:50%;transform:translateX(-50%);background:linear-gradient(#22d3ee,#0891b2);color:#fff;border-radius:6px;padding:6px 12px;font-weight:800;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25);white-space:nowrap}
.tt-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:4px;margin-top:6px}
.tt-slot{min-height:46px;background:#f1f5f9;border:2px dashed #94a3b8;border-radius:8px;font-weight:700;font-size:.85em}
.tt-slot.full{background:linear-gradient(#22d3ee,#0891b2);color:#fff!important;border-style:solid}
/* السلسلة */
.ch-links{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:2px;margin:8px 0}
.ch-l{background:#fff;border:4px solid #64748b;border-radius:999px;padding:6px 12px;font-weight:700;font-size:.88em}.ch-l.q{border-style:dashed;color:#94a3b8}.ch-j{font-size:18px}
/* الحروف */
.sc-ans{display:flex;justify-content:center;gap:4px;margin:8px 0;direction:rtl}
.sc-cell{width:40px;height:46px;border-bottom:4px solid #7c3aed;font-size:1.6em;font-weight:800}
.sc-tiles{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.sc-tile{width:46px;height:50px;background:#fde68a;border:0;border-radius:10px;font-size:1.5em;font-weight:800;box-shadow:0 4px 0 #f59e0b}.sc-tile:disabled{visibility:hidden}
/* البحث عن الكلمات */
.ws-list{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0}.ws-w{background:#f1f5f9;border-radius:999px;padding:0 10px;font-weight:700}.ws-w.done{background:#dcfce7;text-decoration:line-through}
.g52-ws{display:grid;gap:3px;max-width:380px;margin:0 auto;direction:rtl}
.ws-c{aspect-ratio:1;border:0;border-radius:6px;background:#eef2ff;font-size:1.15em;font-weight:800;padding:0}
.ws-c.sel{background:#fde047}.ws-c.fd.h0{background:#86efac}.ws-c.fd.h1{background:#93c5fd}.ws-c.fd.h2{background:#fca5a5}.ws-c.fd.h3{background:#fcd34d}.ws-c.fd.h4{background:#d8b4fe}
/* الكلمات المتقاطعة */
.cw-grid{display:grid;gap:2px;max-width:360px;margin:0 auto;direction:rtl}
.cw-c,.cw-x{aspect-ratio:1;border-radius:4px;position:relative;font-size:1.1em;font-weight:800;display:flex;align-items:center;justify-content:center}
.cw-c{background:#fff;border:2px solid #334155}.cw-c.on{background:#fef9c3}.cw-c i{position:absolute;top:0;right:2px;font-size:9px;font-style:normal;color:#64748b}.cw-x{background:transparent}
.cw-clues{display:grid;gap:4px;margin:8px 0}.cw-q{text-align:right;background:#f8fafc;border:2px solid #e2e8f0;border-radius:10px;padding:4px 8px}.cw-q.on{border-color:#7c3aed;background:#f5f3ff}.cw-q.done{opacity:.5;text-decoration:line-through}
.cw-bank{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.cw-l{width:42px;height:46px;background:#c7d2fe;border:0;border-radius:10px;font-size:1.4em;font-weight:800}
/* التتبع */
.g52-trace{background:#fff;border:3px dashed #c4b5fd;border-radius:18px;touch-action:none}.g52-trace canvas{width:100%;height:190px;display:block}
.tr-meter{height:10px;background:#ede9fe;border-radius:5px;overflow:hidden;max-width:300px;margin:6px auto}.tr-meter i{display:block;height:100%;background:#7c3aed;width:0;transition:width .2s}
/* السودوكو */
.sd-key{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:4px 0}.sd-key span{background:#f1f5f9;border-radius:10px;padding:2px 8px;font-size:.85em}
.g52-sdk{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;max-width:320px;margin:6px auto}
.sd-c{aspect-ratio:1;border:0;border-radius:10px;font-weight:800;font-size:.8em;padding:2px}.sd-c .ge{font-size:1.9em;margin:0}
.sd-c.b0,.sd-c.b3{background:#e0f2fe}.sd-c.b1,.sd-c.b2{background:#fef3c7}.sd-c.g{opacity:1;box-shadow:inset 0 0 0 3px rgba(0,0,0,.12)}.sd-c.h{background:#fff;border:3px dashed #a78bfa}
/* الساعة */
.ck-face{position:relative;width:min(100%,280px);aspect-ratio:1;margin:6px auto;border-radius:50%;background:radial-gradient(#fff,#f1f5f9);border:10px solid #7c3aed;box-shadow:0 8px 20px rgba(0,0,0,.15)}
.ck-n{position:absolute;top:50%;left:50%;width:44px;height:44px;margin:-22px;border:0;border-radius:50%;background:transparent;transform:rotate(var(--a)) translateY(-108px) rotate(calc(-1 * var(--a)));font-weight:800;font-size:1.15em}
.ck-n.on{background:#fde047}
.ck-h,.ck-m{position:absolute;bottom:50%;left:50%;transform-origin:50% 100%;border-radius:4px;transition:transform .3s}
.ck-h{width:8px;height:26%;margin-left:-4px;background:#1f2937}.ck-m{width:5px;height:38%;margin-left:-2.5px;background:#ef4444}
.ck-pin{position:absolute;top:50%;left:50%;width:16px;height:16px;margin:-8px;border-radius:50%;background:#1f2937}
/* التقويم */
.g52-cal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cal-m{background:#fff;border:2px solid #c7d2fe;border-radius:12px;padding:6px 2px;font-weight:700;font-size:.85em;position:relative}.cal-m i{display:block;font-style:normal;color:#7c3aed;font-size:.8em}
.cal-e{display:block;min-height:18px}.cal-card{font-size:1.15em;font-weight:800;background:#fef9c3;border:3px solid #eab308;border-radius:16px;padding:8px;margin:6px 0}
/* الخريطة */
.g52-map{position:relative;aspect-ratio:1/1.05;max-width:440px;margin:6px auto;background:linear-gradient(135deg,#fde68a,#fcd34d 50%,#fbbf24);border-radius:16px;overflow:hidden;border:4px solid #a16207}
.mp-sea{position:absolute;inset:0;width:100%;height:100%}.mp-sea polygon{fill:#38bdf8;stroke:#0ea5e9;stroke-width:.4}
.mp-dot{position:absolute;width:30px;height:30px;margin:-15px;border:0;background:none;padding:0;z-index:2}
.mp-dot i{display:block;width:18px;height:18px;margin:6px;border-radius:50%;background:#dc2626;border:3px solid #fff;box-shadow:0 0 0 2px #7f1d1d}
.mp-dot.found i{background:#16a34a;box-shadow:0 0 0 2px #14532d}
.mp-lb{position:absolute;top:26px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#fff;border-radius:8px;padding:0 6px;font-size:.75em;font-weight:800}.mp-lb:empty{display:none}
.mp-rose{position:absolute;bottom:4px;right:6px;font-size:28px}
/* التسميع */
.g52-ayah{font-size:1.5em;line-height:2.1;background:#fffbeb;border:3px solid #d97706;border-radius:18px;padding:10px 14px;margin:8px 0;font-family:'Amiri','Traditional Arabic',serif}
.g52-ayah span{color:#9ca3af}.g52-ayah span.ok{color:#15803d;font-weight:700}.g52-ayah .slot{color:#e5e7eb}
.g52-btn.mic.rec{background:linear-gradient(#ef4444,#b91c1c);animation:gOk 1s infinite}
.vc-st{font-weight:700;color:#7c3aed;min-height:24px}.vc-tiles{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.vc-t{background:#fef3c7;border:2px solid #f59e0b;border-radius:10px;padding:4px 10px;font-size:1.3em;font-family:'Amiri','Traditional Arabic',serif}.vc-t:disabled{visibility:hidden}
@media (max-width:520px){.g52-ic{font-size:36px}.g52-opts{grid-template-columns:1fr 1fr}.g52-diff{grid-template-columns:1fr}}
/* ===== G52 v2 ===== */
.g2-box{max-width:520px;margin:6px auto;position:relative}
.g2-cvw{position:relative;width:100%;border-radius:18px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.18);background:#0b1020}
.g2-cvw canvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.g2-ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(2,6,23,.55)}.g2-ov.on{display:flex}
.g2-ovc{text-align:center;color:#fff}.g2-big{font-size:1.3em;font-weight:800;margin-bottom:10px}
.g2-pad{display:flex;justify-content:center;gap:10px;margin:8px 0;flex-wrap:wrap}
.g2-k{min-width:58px;height:50px;border:0;border-radius:14px;background:linear-gradient(#e0e7ff,#c7d2fe);font-size:22px;font-weight:800;color:#312e81!important;box-shadow:0 4px 0 #818cf8;touch-action:none;user-select:none;-webkit-user-select:none}
.g2-k.on,.g2-k:active{transform:translateY(3px);box-shadow:0 1px 0 #818cf8;background:#a5b4fc}
.g2-k-fire,.g2-k-jump,.g2-k-act{min-width:90px;background:linear-gradient(#fde68a,#f59e0b);box-shadow:0 4px 0 #b45309;color:#7c2d12!important}
@media (hover:hover) and (pointer:fine){.g2-pad{opacity:.75}}
.g2-hint{text-align:center;font-size:.8em;color:#6b7280}
.g2-legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;margin:6px 0}
.g2-lg{display:flex;gap:8px;align-items:center;background:#fff;border:2px solid #e5e7eb;border-radius:12px;padding:6px 8px;text-align:right;font-weight:600;font-size:.95em;line-height:1.5}
.g2-lg b{flex:0 0 auto;width:28px;height:28px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:.95em}
.g2-lg.ok{border-color:#22c55e;background:#dcfce7}.g2-lg.no{border-color:#ef4444;background:#fee2e2;opacity:.7}
.g2-tries{text-align:center;font-size:.85em;color:#475569;min-height:20px}
.g2-goal{text-align:center;font-weight:800;background:#fef3c7;border:2px solid #f59e0b;border-radius:14px;padding:6px 10px;margin:6px 0;color:#7c2d12}

body{font-family:system-ui,'Segoe UI',Tahoma,sans-serif;margin:0;background:#f5f3ff;color:#1f2a44}
header{background:linear-gradient(135deg,#7c3aed,#0ea5e9);color:#fff;padding:16px;text-align:center}header h1{margin:0;font-size:1.4em}header p{margin:6px 0 0;opacity:.9;font-size:.95em}

</style></head><body><header><h1>🎮 معرض الألعاب الجديدة</h1><p>48 لعبة حركية + 4 ألعاب الدروس الأصلية (التصنيف، التوصيل، الذاكرة، الترتيب) = 52 لعبة</p></header>

      S.c.save(); S.c.translate(sx, by); S.c.rotate(stick.a); S.c.strokeStyle = '#78350f'; S.c.lineWidth = 5; S.c.beginPath(); S.c.moveTo(0, 0); S.c.lineTo(0, -stick.len); S.c.stroke(); S.c.restore(); }

/* 4) التسميع الصوتي: ayat[{t}] — بديل تلقائي: ترتيب كلمات الآية */
G52.reg('voice', {name:'التسميع الصوتي', icon:'🎤', form:'voice', render(ctx) {
  const A = ctx.cfg.ayat.slice(0, [1, 2, 2, 3][ctx.lvl]), SR = window.SpeechRecognition || window.webkitSpeechRecognition; let k = 0, score = 0;
  const words = t => U.plain(t).replace(/[﴿﴾۝\d٠-٩]/g, ' ').split(/\s+/).filter(Boolean), nb = w => G52.bare(w).replace(/[إأآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه');
  ctx.host.innerHTML = ctx.head('🎤', 'التسميع الصوتي', SR ? 'اضغط المايك واقرأ الآية بصوتك؛ تتلوّن كل كلمة تنطقها صحيحة' : 'رتّب كلمات الآية بالترتيب الصحيح') + `<div id="vd"></div>`;
  const next = () => { if (k >= A.length) { ctx.after(700, () => ctx.done(score / A.length)); return; } SR && !ctx.__noVoice ? listen() : order(); };
  const listen = () => {
    const W = words(A[k].t), N = W.map(nb); let got = 0, rec = null, on = false;
    const paint = () => ctx.$('#vw').innerHTML = W.map((w, i) => `<span class="${i < got ? 'ok' : ''}">${esc(w)}</span>`).join(' ');
    ctx.$('#vd').innerHTML = ctx.dots(A.length, k, []) + `<div class="g52-ayah" id="vw"></div><div class="g52-row"><button class="g52-btn big mic" id="mic">🎤 ابدأ القراءة</button><button class="g52-btn" id="alt">🧩 رتّب الكلمات بدلًا من ذلك</button></div><div class="vc-st" id="vs"></div>`;
    paint();
    const finish = frac => { if (rec) try { rec.abort(); } catch (e) {} score += frac; if (frac > .6) { ctx.ok(ctx.$('#vw')); ctx.api.praise(); } k++; ctx.after(900, next); };
    ctx.$('#alt').onclick = () => { if (rec) try { rec.abort(); } catch (e) {} order(); };
    ctx.$('#mic').onclick = () => {
      if (on) { try { rec.stop(); } catch (e) {} return; }
      try { rec = new SR(); } catch (e) { order(); return; }
      rec.lang = 'ar-SA'; rec.continuous = true; rec.interimResults = true; on = true; ctx.$('#mic').textContent = '⏹ توقّف'; ctx.$('#mic').classList.add('rec'); ctx.set('vs', '🎙️ أستمع إليك…');
      rec.onresult = ev => { let txt = ''; for (const r of ev.results) txt += ' ' + r[0].transcript; const heard = txt.split(/\s+/).filter(Boolean).map(nb); let j = 0; for (const h of heard) { if (j < N.length && (h === N[j] || h.includes(N[j]) || N[j].includes(h) && h.length > 2)) j++; } if (j > got) { got = j; paint(); } if (got >= N.length) finish(1); };
      rec.onerror = e => { ctx.set('vs', e.error === 'not-allowed' ? '⚠️ لم يُسمح بالمايك. استعمل «رتّب الكلمات».' : '⚠️ تعذّر الاستماع، حاول مرة أخرى.'); };
      rec.onend = () => { on = false; const b = ctx.$('#mic'); if (!b) return; b.textContent = '🎤 أعد المحاولة'; b.classList.remove('rec'); if (got / N.length >= .8) finish(1); else if (got > 0) ctx.set('vs', `قرأت ${U.arn(got)} من ${U.arn(N.length)} كلمة. أعد المحاولة، أو رتّب الكلمات.`); };

    ctx.$$('.vc-t').forEach(b => b.onclick = () => { if (b.disabled) return; if (W[+b.dataset.i] === W[n]) { ctx.$$('#vw span')[n].outerHTML = `<span class="ok">${esc(W[n])}</span>`; n++; b.disabled = true; ctx.api.sfx('tap'); if (n >= W.length) { score += U.clamp((W.length - err) / W.length, 0, 1); ctx.ok(ctx.$('#vw')); ctx.api.praise(); k++; ctx.after(900, next); } } else { err++; ctx.bad(b); } });
  };
  next(); ctx.__A = A;
}, solve(ctx) { ctx.__noVoice = true; const go = () => { if (!ctx.alive()) return; const alt = ctx.$('#alt'); if (alt) alt.click(); const t = ctx.$$('.vc-t:not([disabled])'); const slots = ctx.$$('#vw span.slot'); if (t.length && slots.length) { const n = ctx.$$('#vw span.ok').length; const W = ctx.$$('#vw span').length; const target = ctx.__A.find(() => true); } const b = ctx.$$('.vc-t:not([disabled])').sort((a, b) => +a.dataset.i - +b.dataset.i)[0]; if (b) b.click(); ctx.after(80, go); }; go(); }});
})();
/* ===== مفتاح الإجابات لدليل المعلم ===== */
(function () {
const {U} = G52, T = o => { o = U.O(o); return ((o.e || '') + ' ' + U.plain(o.t || '')).trim(); };
G52.name = k => (G52.games[k] || {}).name || k;
G52.keyOf = function (k, c) {
  const f = (G52.games[k] || {}).form;
  switch (f) {
    case 'mcq': return c.rounds.map(r => `• ${U.plain(r.q)} ← <b>${T(r.opts[r.a])}</b>`).join('<br>');
    case 'num': return c.nums.map(r => `• ${U.plain(r.q)} ← <b>${r.ans}</b>`).join('<br>');
    case 'cls': case 'cls2':
      if (f === 'cls' && !['grid'].includes(k)) return '<b>المطلوب: ' + U.plain(U.O(c.bins[c.good ?? 0]).t) + '</b><br>' + c.items.filter(x => x.b === (c.good ?? 0)).map(T).join('، ');
      return c.items.map(x => `• ${T(x)} ← <b>${U.plain(U.O(c.bins[x.b]).t)}</b>`).join('<br>');
    case 'seq': return c.items.map((x, i) => `${U.arn(i + 1)}. ${T(x)}`).join('<br>');
    case 'words': return c.words.map(w => `• ${U.plain(w.hint || '')} ← <b>${w.w}</b>`).join('<br>');
    case 'sym': return 'كل صف وكل عمود وكل مربع فيه: ' + c.symbols.slice(0, 4).map(T).join('، ');
    case 'clock': return c.clocks.map(x => `• ${U.plain(x.q)} ← <b>${U.arn(x.h)}:${String(x.m).padStart(2, '0')}</b>`).join('<br>');
    case 'cal': return c.events.map(x => `• ${T(x)} ← <b>${G52.HM ? G52.HM[x.m - 1] : x.m}</b>`).join('<br>');
    case 'map': return c.places.map(x => '• ' + U.plain(x.t)).join('<br>');
    case 'voice': return c.ayat.map(x => '• ' + x.t).join('<br>');
  }
  return '';
};
})();
/* حل آلي للاختبار فقط (لا يظهر للطالب) */
(function () {
const {U} = G52;
G52.autoSolve = ctx => { const usedG = new Set(); ctx.every(450, () => {
  if (ctx.S && ctx.S.__go) ctx.S.__go();
  const M = ctx.__M; if (M && M.cur) M.hit(M.cur.a);
  const K = ctx.__K; if (K && !K.over) { const it = K.G.find(x => !usedG.has(x)) || K.G[0]; usedG.add(it); K.take(it, 100, 100, ctx.S); }
  const Q = ctx.__Q; if (Q && !Q.over && Q.want()) Q.take(Q.want(), 100, 100, ctx.S);
}); };
Object.values(G52.games).forEach(d => { if (!d.solve) d.solve = G52.autoSolve; });
})();

window.FORM2DATA = {any:'cls',mcq:'mcq',num:'num',cls:'cls',cls2:'cls3',seq:'seq',words:'words',sym:'sym',clock:'clock',cal:'cal',map:'map',voice:'voice'};

const GROUPS=[['🎯 تصويب وقيادة ومهارة (يجيب عن السؤال بالحركة)',['mcq','num']],['🏃 التقاط وتصنيف أثناء الحركة',['cls','cls2','any']],['🔢 ترتيب بالحركة',['seq']],['🔤 حروف وكلمات',['words','sym']],['🕌 ألعاب خاصة بمحتوى الدرس',['clock','cal','map','voice']]];
let cur=null;
function play(k){const st=document.getElementById('stage');if(st.__g)st.__g.__stop&&st.__g.__stop();st.innerHTML='<div></div>';const h=st.firstChild;st.__g=h;document.getElementById('res').textContent='';
 const def=G52.games[k];let cfg=JSON.parse(JSON.stringify(SAMPLE[FORM2DATA[def.form]]));
 G52.run(h,k,cfg,{lvl:+document.getElementById('lv').value,done:f=>{document.getElementById('res').textContent='🏁 انتهت اللعبة — النتيجة: '+Math.round(f*100)+'%';}});
 document.querySelectorAll('.gb').forEach(b=>b.classList.toggle('on',b.dataset.k===k));cur=k;st.scrollIntoView({behavior:'smooth'});}
document.getElementById('list').innerHTML=GROUPS.map(([t,fs])=>`<h2 class="sec">${t}</h2><div class="grid">${Object.entries(G52.games).filter(([k,d])=>fs.includes(d.form)).map(([k,d])=>`<button class="gb" data-k="${k}"><span>${d.icon}</span>${d.name}</button>`).join('')}</div>`).join('');
document.querySelectorAll('.gb').forEach(b=>b.onclick=()=>play(b.dataset.k));document.getElementById('lv').onchange=()=>cur&&play(cur);
